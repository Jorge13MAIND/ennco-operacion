name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ennco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:rtm
      - run: npm run verify:data
      - run: npm run verify:secrets
      - run: npm run verify:campaign
      - run: npm run verify:m5-canary
      - run: npm run verify:m6-readiness
      - run: npm run verify:m7-readiness
      - run: npm run verify:m8-readiness
      - run: npm run verify:m9-readiness
      - run: npm run verify:audit
      - run: npm run verify
      - run: npm run sbom > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  database-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve PostgreSQL binaries
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: npm run verify:db
      - run: npm run verify:storage
      - run: npm run verify:retention
      - run: npm run verify:prequote-db
      - run: npm run verify:analytics-db
      - run: npm run verify:gmail-db
      - run: npm run verify:canary-db
      - run: npm run verify:first-send-db
      - run: npm run verify:scaling-db
      - run: npm run verify:monthly-reporting-db
      - run: npm run verify:handoff-db
      - run: npm run capture:m2-restore
      - run: npm run capture:m9-restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-recovery-evidence
          path: evidence/m2-restore
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m9-recovery-evidence
          path: evidence/m9-restore
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
