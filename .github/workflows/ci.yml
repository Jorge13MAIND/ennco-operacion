name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*", "enterprise-*"]

concurrency:
  group: ennco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Snapshot clean source tree and bind commit
        run: node scripts/security-evidence-gate.mjs snapshot --repo . --expected-commit "$GITHUB_SHA" --evidence security-evidence/source.json --context github_actions
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: /language:javascript-typescript
          output: codeql-results
      - name: Gate CodeQL SARIF and bind evidence to commit
        if: always()
        run: node scripts/security-evidence-gate.mjs sarif --repo . --expected-commit "$GITHUB_SHA" --source-snapshot security-evidence/source.json --input codeql-results --evidence security-evidence/codeql.json --context github_actions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codeql-evidence-${{ github.sha }}
          path: |
            codeql-results
            security-evidence/codeql.json
          if-no-files-found: error
          retention-days: 30

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Snapshot clean source tree and bind commit
        run: node scripts/security-evidence-gate.mjs snapshot --repo . --expected-commit "$GITHUB_SHA" --evidence security-evidence/source.json --context github_actions
      - run: npm ci
      - name: Generate and validate CycloneDX SBOM
        run: |
          npm sbom --offline --sbom-format cyclonedx > sbom.raw.cdx.json
          node scripts/security-evidence-gate.mjs sbom --repo . --expected-commit "$GITHUB_SHA" --source-snapshot security-evidence/source.json --raw sbom.raw.cdx.json --output sbom.cdx.json --evidence security-evidence/sbom.json --context github_actions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sbom-${{ github.sha }}
          path: |
            sbom.raw.cdx.json
            sbom.cdx.json
            security-evidence/source.json
            security-evidence/sbom.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run verify:rtm
      - run: npm run verify:data
      - run: npm run verify:secrets
      - run: npm run verify:campaign
      - run: npm run verify:m5-canary
      - run: npm run verify:m6-readiness
      - run: npm run verify:m7-readiness
      - run: npm run verify:m8-readiness
      - run: npm run verify:m9-readiness
      - run: npm run verify:audit
      - run: npm run verify:enterprise-security
      - run: npm run verify
      - name: Local synthetic performance smoke
        run: |
          npm run start > /tmp/ennco-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/api/v1/health >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ennco-next.log
              exit 1
            fi
            sleep 1
          done
          npm run verify:performance:smoke
  database-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve PostgreSQL binaries
        run: pg_config --bindir >> "$GITHUB_PATH"
      - run: npm run verify:db
      - run: npm run verify:storage
      - run: npm run verify:retention
      - run: npm run verify:retention-live
      - run: npm run verify:prequote-db
      - run: npm run verify:analytics-db
      - run: npm run verify:gmail-db
      - run: npm run verify:canary-db
      - run: npm run verify:first-send-db
      - run: npm run verify:scaling-db
      - run: npm run verify:monthly-reporting-db
      - run: npm run verify:handoff-db
      - run: npm run verify:security-consistency-db
      - run: npm run verify:unsubscribe-db
      - run: npm run verify:commercial-integrity-db
      - run: npm run verify:suppression-privacy-db
      - run: npm run verify:commercial-operations-db
      - run: npm run verify:strict-lead-suppression-db
      - run: npm run verify:capacity-db
      - run: npm run verify:research-db
      - run: npm run verify:operations-sla-db
      - run: npm run verify:cadence-db
      - run: npm run capture:m2-restore
      - run: npm run capture:m9-restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-recovery-evidence
          path: evidence/m2-restore
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m9-recovery-evidence
          path: evidence/m9-restore
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install pinned k6 with verified archive checksum
        run: |
          archive="$RUNNER_TEMP/k6-v1.6.1-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/grafana/k6/releases/download/v1.6.1/k6-v1.6.1-linux-amd64.tar.gz
          echo "68df4958a1b089dc6f70a234e07c7ec818922f83b261ca24f3abf79882b13343  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/k6-v1.6.1-linux-amd64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/k6-v1.6.1-linux-amd64/k6" version
      - name: Enterprise frontend and multipath load smoke
        run: npm run verify:m23:frontend:smoke
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m23-frontend-evidence-${{ github.sha }}
          path: evidence/m23-frontend
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  dast-baseline:
    name: ZAP passive baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Snapshot clean source tree and bind commit
        run: node scripts/security-evidence-gate.mjs snapshot --repo . --expected-commit "$GITHUB_SHA" --evidence security-evidence/source.json --context github_actions
      - run: npm ci
      - run: npm run build
      - name: Restore generated source shim and revalidate the clean snapshot
        run: |
          git restore --source "$GITHUB_SHA" -- next-env.d.ts
          node scripts/security-evidence-gate.mjs verify-snapshot --repo . --expected-commit "$GITHUB_SHA" --source-snapshot security-evidence/source.json --allow-prefix security-evidence --context github_actions
      - name: Start fail-closed synthetic application
        run: |
          nohup npm run start > /tmp/ennco-next.log 2>&1 &
          echo $! > /tmp/ennco-next.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/api/v1/health >/dev/null && exit 0
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ennco-next.log
              exit 1
            fi
            sleep 1
          done
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:3000
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-synthetic-${{ github.sha }}
          cmd_options: "-J zap-report.json"
      - name: Gate ZAP JSON and bind evidence to commit
        if: always()
        run: node scripts/security-evidence-gate.mjs zap --repo . --expected-commit "$GITHUB_SHA" --source-snapshot security-evidence/source.json --input zap-report.json --evidence security-evidence/zap.json --allow-prefix report_json.json --allow-prefix report_md.md --allow-prefix report_html.html --allow-prefix zap.yaml --context github_actions --authenticated false --expected-target http://127.0.0.1:3000 --target-class synthetic_localhost
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-evidence-${{ github.sha }}
          path: |
            zap-report.json
            security-evidence/source.json
            security-evidence/zap.json
          if-no-files-found: error
          retention-days: 30
